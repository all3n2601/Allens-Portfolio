<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Global meta (page-specific title, description, canonical, Open Graph and Twitter tags live in each route's <svelte:head>) -->
<meta name="author" content="Allen Febi M A" />
<meta name="robots" content="index, follow" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap" rel="stylesheet">

<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
<meta name="theme-color" content="#F4F6F8" />
%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" style="overflow-x: hidden;">
<div style="display: contents; position: relative; z-index: 1;">%sveltekit.body%</div>


</body>
</html>
