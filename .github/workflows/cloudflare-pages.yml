name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CF_PAGES_PROJECT: shippedbyallen-portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Cloudflare Pages project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.CF_PAGES_PROJECT }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub secrets."
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")

          if [ "$http_code" != "200" ]; then
            echo "::error::Cloudflare API returned HTTP ${http_code}."
            cat /tmp/cf-pages.json || true
            exit 1
          fi

          if jq -e --arg name "$PROJECT_NAME" '.result[] | select(.name == $name)' /tmp/cf-pages.json > /dev/null; then
            echo "Pages project '${PROJECT_NAME}' already exists."
          else
            echo "Creating Pages project '${PROJECT_NAME}'..."
            create_code=$(curl -sS -o /tmp/cf-create.json -w "%{http_code}" -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${PROJECT_NAME}\",\"production_branch\":\"main\"}")

            if [ "$create_code" != "200" ]; then
              echo "::error::Failed to create Pages project (HTTP ${create_code})."
              cat /tmp/cf-create.json || true
              exit 1
            fi

            echo "Pages project created."
          fi

      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy build --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
