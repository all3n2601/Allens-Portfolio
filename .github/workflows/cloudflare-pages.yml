name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

          http_code=$(curl -sS -o /tmp/cf-pages.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json")

          if [ "$http_code" != "200" ]; then
            echo "::error::Cloudflare API returned HTTP ${http_code}. Token lacks permissions or account ID is wrong."
            cat /tmp/cf-pages.json || true
            echo ""
            echo "Recreate the token at https://dash.cloudflare.com/profile/api-tokens with a CUSTOM token:"
            echo "  - Account → Cloudflare Pages → Edit"
            echo "  - User → Memberships → Read"
            echo "  - User → User Details → Read"
            echo "  - Account → Account Settings → Read"
            echo "Scope the token to your account, then update CLOUDFLARE_API_TOKEN in GitHub secrets."
            exit 1
          fi

          echo "Cloudflare API token verified."

      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: shippedbyallen-portfolio
          directory: build
          branch: main
          wranglerVersion: "4"
